<div class="page-header">
  <div class="title-row">
    <div class="title-left">
      <button class="back-btn" (click)="goBack()">
        <lucide-angular [img]="BackIcon" [size]="18" />
      </button>
      <h1 class="page-title font-display">Notificaciones</h1>
    </div>
    @if (notifications.unreadCount() > 0) {
      <button class="mark-all font-display" (click)="notifications.markAllAsRead()">Marcar todas</button>
    }
  </div>
  @if (notifications.unreadCount() > 0) {
    <p class="page-subtitle">{{ notifications.unreadCount() }} sin leer</p>
  }
</div>

<div class="page-list scrollbar-hide">
  @if (notifications.sorted().length === 0) {
    <div class="empty-state">
      <lucide-angular [img]="BellIcon" [size]="40" />
      <p>No tienes notificaciones</p>
    </div>
  } @else {
    @for (n of notifications.sorted(); track n.id) {
      <button class="notif-row" [class.read]="n.read" (click)="open(n)">
        <div class="notif-icon" [class]="'notif-icon ' + typeMeta[n.type].tileClass">
          <lucide-angular [img]="typeMeta[n.type].icon" [size]="16" />
        </div>
        <div class="notif-info">
          <div class="notif-top">
            <p class="notif-title font-display">{{ n.title }}</p>
            <span class="notif-time">{{ relativeTime(n.createdAt) }}</span>
          </div>
          <p class="notif-message">{{ n.message }}</p>
        </div>
        @if (!n.read) {
          <div class="unread-dot"></div>
        }
      </button>
    }
  }
</div>
